[tool.poetry]
name = "dhwb"
version = "0.12.15.dev0"
description = "Fork of WikibaseIntegrator by DinhHuy2010"
authors = [
    "DinhHuy2010",
    "Myst",
    "Wikibase Integrator authors",
    "Wikidata Integrator authors",
]
license = "MIT"
readme = "README.md"
packages = [{ include = "dhwb" }]
include = [{ path = "tests", format = "sdist" }]
homepage = "https://github.com/DinhHuy2010/dhwb"
repository = "https://github.com/DinhHuy2010/dhwb"
# documentation = "https://wikibaseintegrator.readthedocs.io"
keywords = ["wikibase", "wikidata", "mediawiki", "sparql"]
classifiers = [
    "Programming Language :: Python",
    # "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/LeMyst/WikibaseIntegrator/issues"
Changelog = "https://github.com/LeMyst/WikibaseIntegrator/releases"

[tool.poetry.dependencies]
python = "^3.10"
backoff = "^2.2.1"
mwoauth = "^0.4.0"
oauthlib = "^3.2.2"
requests = "^2.32.3"
requests-oauthlib = "^2.0.0"
ujson = "^5.10.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.5"
pytest = "^9.0.1"
pytest-cov = "^7.0.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "*"
readthedocs-sphinx-ext = "*"
sphinx-rtd-theme = "*"
sphinx-github-changelog = "*"
sphinx-autodoc-typehints = "*"
toml = "*"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyter = "*"
# Force jupyterlab 4.2.5 to have the latest version of notebook
jupyterlab = "^4.2.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# [tool.isort]
# line_length = 179

# [tool.mypy]
# ignore_missing_imports = true
# files = "wikibaseintegrator/**/*.py,test/*.py"

# [tool.pylint.MASTER]
# extension-pkg-allow-list = [
#     "ujson"
# ]

# [tool.pylint.messages_control]
# max-line-length = 180
# disable = [
#     "fixme",
#     "redefined-builtin",
#     "invalid-name", # To remove later
#     "too-few-public-methods",
#     "too-many-arguments",
#     "too-many-statements",
#     "too-many-locals",
#     "too-many-branches",
#     "too-many-instance-attributes",
#     "import-outside-toplevel"  # To remove later
# ]

[tool.pytest.ini_options]
log_cli = true

# Use ruff here, generated by ChatGPT

[tool.ruff]
# Match your Pylint max-line-length (180). isort had 179; you can
# change this to 179 if you want everything perfectly aligned.
line-length = 180

# From [tool.poetry.dependencies] python = "^3.10"
target-version = "py310"

[tool.ruff.lint]
# Core rule sets:
# E,F   = pycodestyle + pyflakes
# I     = isort-like import sorting
# PL    = Pylint-compatible rules
select = ["E", "F", "I", "PL"]

# Replicate your Pylint "disable = [...]" list:
ignore = [
    # fixme
    # "PLW0511", # Pylint "fixme" (W0511)
    "FIX001",  # Line contains FIXME
    "FIX002",  # Line contains TODO
    "FIX003",  # Line contains XXX
    "FIX004",  # Line contains HACK

    # redefined-builtin
    # "PLW0622", # Pylint "redefined-builtin" (W0622)
    "A001",    # Ruff builtin-variable-shadowing (flake8-builtins)

    # invalid-name  (you had this disabled in Pylint)
    # Ruff’s naming rules live in the pep8-naming plugin ("N").
    # We just don’t enable "N" here, so no naming warnings.

    # too-few-public-methods
    # "PLR0903",

    # too-many-arguments / locals / branches / instance attrs / statements
    # "PLR0902", # too-many-instance-attributes
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements

    # import-outside-toplevel
    "PLC0415",
]

# You only configured isort's line_length; Ruff uses the global
# `line-length` above for this, so no extra options are required here.
# Add options here later if you customize import layout.

# Optional: if you *do* want Pylint-style "too many X" checks back,
# keep PL in `select` but remove the corresponding PLR09xx from ignore.
